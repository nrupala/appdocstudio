<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AppDocStudio</title>
<style>
  body { font-family: system-ui, sans-serif; width: 340px; margin: 12px; }
  label { display: block; font-size: 12px; margin-top: 8px; }
  input, select { width: 100%; box-sizing: border-box; margin-top: 2px; }
  button { margin-top: 10px; width: 100%; }
  pre { white-space: pre-wrap; font-size: 11px; max-height: 260px; overflow: auto;
        background: #f4f4f4; padding: 8px; }
  .hint { font-size: 11px; color: #555; }
</style>
</head>
<body>
<h1 style="font-size:15px;margin:0">AppDocStudio</h1>
<p class="hint">Talks to the AppDocStudio API on this machine.
Start it with <code>appdocstudio serve</code>, then generate a pack for a
local project folder.</p>
<label>API base <input id="api" value="http://127.0.0.1:8932"></label>
<label>Project folder (local path) <input id="path" placeholder="/home/you/project"></label>
<label>Role pack
  <select id="role">
    <option>users</option><option>developers</option><option>maintainers</option>
    <option>regulators</option><option>admins</option><option>ops</option>
  </select></label>
<label>Standards format
  <select id="docformat">
    <option>diataxis</option><option>apache</option><option>google</option>
    <option>microsoft</option><option>apple</option><option>w3c</option>
    <option>iso</option><option>ansi</option><option>en</option>
  </select></label>
<button id="go">Generate pack</button>
<button id="save" disabled>Download .md</button>
<pre id="out" aria-live="polite"></pre>
<script src="popup.js"></script>
</body>
</html>
